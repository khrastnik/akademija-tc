# »Dan na terenu«: vsak dan trije klici. `par` = minute meritev, ki jih rabi dober serviser.
- id: dan-1
  title: Ponedeljek – prvi dan
  intro: Začneš lahko. Klici so pogosti in rešljivi brez manometrov.
  calls:
    - fault: nastavitev
      place: Hiša v Domžalah
      customer: Gospa Mojca
      call: »Črpalka dela, ampak radiatorji so samo mlačni. Sin je včeraj nekaj nastavljal na zaslonu.«
      par: 5
    - fault: ovira-zraka
      place: Vikend na Gorenjskem
      customer: Gospod Tone
      call: »Grelo je slabo že od ponedeljka. Zunaj je enota čisto bela, včasih se iz nje kadi.«
      par: 8
    - fault: filter
      place: Starejša hiša v Celju
      customer: Družina Kranjc
      call: »Zjutraj je na zaslonu visok tlak, potem se sama zažene. Ravno smo menjali stare radiatorje.«
      par: 18
- id: dan-2
  title: Torek – več dela
  intro: Prvi klici, kjer ne gre brez manometrov. Najprej vseeno preveri najlažje.
  calls:
    - fault: zrak-v-vodi
      place: Novogradnja v Kranju
      customer: Gospod Luka
      call: »V ceveh nekaj šumi in klokota, na zaslonu je napaka pretoka.«
      par: 5
    - fault: premalo-hladiva
      place: Hiša ob morju, Izola
      customer: Gospa Ana
      call: »Lani je grelo super, letos komaj. Elektrike pa porabi enako.«
      par: 25
    - fault: senzor
      place: Pisarna v Ljubljani
      customer: Gospod Marko
      call: »Zaslon kaže, da je voda topla, v pisarni pa zebe.«
      par: 7
- id: dan-3
  title: Sreda – mojstrski izziv
  intro: Napake, ki se lahko pretvarjajo druga v drugo. Primerjaj SH in SC.
  calls:
    - fault: prevec-hladiva
      place: Hiša v Mariboru
      customer: Gospa Petra
      call: »Jeseni je bil tu drug serviser in dolil hladivo. Zdaj je črpalka glasnejša in več porabi.«
      par: 12
    - fault: eev
      place: Kmetija pri Novem mestu
      customer: Gospod Jože
      call: »Grelo je dobro, potem vedno slabše. Prejšnji teden so rekli, da je hladiva dovolj.«
      par: 22
    - fault: filter
      place: Blok v Velenju
      customer: Hišnik Branko
      call: »Toplotna črpalka se ustavlja z visokim tlakom. Po sistemu so ravno menjali cevi.«
      par: 18
- id: dan-4
  title: Četrtek – mraz in tuši
  intro: Novi deli – 3-potni ventil, 4-potni ventil, filter sušilnik. Dva klica rešiš brez manometrov.
  calls:
    - fault: tripotni
      place: Družinska hiša v Kamniku
      customer: Gospa Nina
      call: »Tople vode imamo toliko, da se opečeš, v dnevni sobi pa je 17 stopinj.«
      par: 8
    - fault: odtajevanje
      place: Hiša na Pohorju
      customer: Gospod Rok
      call: »Zunanja enota je cela bela kot hladilnik, ki ga nismo odtalili. Pozimi greje vedno slabše.«
      par: 9
    - fault: filter-susilnik
      place: Hiša v Ptuju
      customer: Gospod Stane
      call: »Lani so menjali kompresor. Od takrat greje slabo, prejšnji serviser pravi, da hladiva ne manjka.«
      par: 24
- id: dan-5
  title: Petek – zalogovnik
  intro: Nove naprave imajo zalogovnik in dve obtočni črpalki. Primerjaj temperaturo pred zalogovnikom in za njim – in ne pozabi na števec.
  calls:
    - fault: mesanje-zalogovnik
      place: Novogradnja v Kranju
      customer: Gospod Matej
      call: »Cevi pri notranji enoti so vroče, radiatorji pa le mlačni. Inštalater je pred tednom 'malo pospešil' črpalko.«
      par: 9
    - fault: taktiranje
      place: Prenovljena hiša v Novem mestu
      customer: Gospa Tanja
      call: »Zunanja enota se ves dan vklaplja in izklaplja, kot da ne ve, kaj bi. Po prenovi kotlovnice je tako.«
      par: 7
    - fault: dogrevalnik-meja
      place: Hiša v Velenju
      customer: Gospod Bojan
      call: »V hiši je toplo, a račun za elektriko je skoraj dvojen. Saj ni bilo tako mrzlo!«
      par: 6
