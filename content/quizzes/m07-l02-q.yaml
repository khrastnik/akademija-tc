id: m07-l02-q
lesson: m07-l02
questions:
  - id: q1
    type: single
    text: Zakaj je prenizko pregrevanje nevarno za kompresor?
    understand:
      simpler: Kaj pride v kompresor, ko tekočina seže do konca uparjalnika?
      terms: [pregrevanje, kompresor]
      hint: Spomni se tlačilke z vodo.
    options:
      - id: a
        text: Kapljice tekočine pridejo v kompresor
        correct: true
        why: Tekočine ni mogoče stisniti. Kapljice obremenjujejo dele in izpirajo olje.
      - id: b
        text: Kompresor se zaradi tega pregreje
        why: Pregrevanje kompresorja grozi pri previsokem pregrevanju, ne pri prenizkem.
      - id: c
        text: Hladivo v kompresorju zmrzne
        why: Hladivo ne zmrzne. Težava je tekočina, ki je ni mogoče stisniti.
    lessonLink: m07-l02#why

  - id: q2
    type: single
    text: Kateri namig kaže, da v kompresor morda prihaja tekočina?
    understand:
      simpler: Kaj se zgodi s temperaturo za kompresorjem, ko vanj prihajajo hladne kapljice?
      terms: [pregrevanje]
      hint: Ivje na sesalnem vodu pozimi ni zanesljiv znak.
    options:
      - id: a
        text: Nenavadno hladen tlačni vod
        correct: true
        why: Kapljice tekočine kompresor ohladijo, zato je tlačni vod hladnejši kot ob zagonu.
      - id: b
        text: Ivje na sesalnem vodu pozimi
        why: Pri ogrevanju je sesalni vod pod ničlo tudi pri normalnem pregrevanju – ivje je lahko povsem normalno.
      - id: c
        text: Suha in čista zunanja enota
        why: Čista enota je dober znak, ne kaže na tekočino v kompresorju.
    lessonLink: m07-l02#measure

  - id: q3
    type: truefalse
    text: Čim hladnejši je tlačni vod za kompresorjem, tem bolje naprava dela.
    understand:
      simpler: Ali je hladen tlačni vod znak zdravja ali znak, da v kompresor prihaja tekočina?
      terms: [pregrevanje]
      hint: »Hladno pomeni dobro« je napaka iz lekcije.
    options:
      - id: da
        text: DA
        why: Nenavadno hladen tlačni vod lahko pomeni, da v kompresor prihaja tekočina.
      - id: ne
        text: NE
        correct: true
        why: Prav. Hladen tlačni vod je opozorilo – pregrevanje je morda prenizko.
    lessonLink: m07-l02#field-error
