id: varno-nevarno-sh
kind: sort
groups:
  - id: varno
    label: Varno za kompresor
  - id: nevarno
    label: Nevarno za kompresor
items:
  - id: obmocje
    text: Pregrevanje v območju iz navodil proizvajalca
    group: varno
    why: Varnostni rob je zagotovljen – v kompresor gre samo para.
  - id: stabilno
    text: Pregrevanje stabilno pri ustaljenem delovanju
    group: varno
    why: Ventil in krmilnik delata, kot morata.
  - id: ivje-zima
    text: Pozimi ivje na sesalnem vodu, pregrevanje pa v območju iz navodil
    group: varno
    why: Pri ogrevanju je sesalni vod pod ničlo tudi pri normalnem pregrevanju. Ivje samo po sebi ni napaka.
  - id: nic
    text: Pregrevanje skoraj nič
    group: nevarno
    why: Ni varnostnega roba – kapljice lahko pridejo v kompresor.
  - id: tlacni-hladen
    text: Tlačni vod je nenavadno hladen v primerjavi z zagonom
    group: nevarno
    why: Kapljice tekočine kompresor ohladijo – znak, da v kompresor prihaja tekočina.
  - id: senzor
    text: Senzor sesalnega voda je zdrsnil iz objemke
    group: nevarno
    why: Krmilnik misli, da je pregrevanje višje, kot je, in ventil odpre preveč.
