    nalogi:
      - id: DN-2026-045
        datum: 2026-02-03
        vrsta: Svetovanje – poraba
        status: zakljucen
        klic:
          simptom: Poraba elektrike v januarju precej višja od pričakovane, v hiši je pretoplo.
          od_kdaj: Od začetka kurilne sezone.
          stranka_ze: Zniževala sobne termostate, poraba se ni spremenila.
          pripravim: Navodila naprave (krivulja ogrevanja), termometra za cevi.
        obhod:
          - Krivulja ogrevanja nastavljena strmo, pri 0 °C zunaj zahteva 42 °C vode.
          - Vsi sobni termostati zaprti na 20 °C, zanke pogosto zaprte – naprava pogosto vklaplja in izklaplja.
          - Tlak vode 1,5 bar.
        pogoji: "Zunaj 0 °C, ogrevanje"
        meritve:
          - { velicina: "Dvižni vod", pred: "42 °C", po: "33 °C" }
          - { velicina: "Vklopi kompresorja na uro", pred: "5", po: "1" }
        vzrok: Previsoka krivulja ogrevanja, termostati jo zapirajo – naprava dela z visoko temperaturo in pogostimi vklopi.
        dokaz: Po znižanju krivulje in odprtju termostatov se temperatura v prostorih drži, kompresor dela enakomerno.
        popravilo:
          - Krivulja znižana (zahteva pri 0 °C zunaj 33 °C).
          - Sobni termostati v bivalnih prostorih nastavljeni na najvišje, regulira krivulja.
        priporocila:
          - Krivuljo popravljati po korakih in počakati 2–3 dni.
          - Poraba za primerjavo zapisovati vsak teden.
        klic_po: "Čez 10 dni: v hiši 21 °C, tedenska poraba nižja za približno četrtino."

