# Primer servisne mape: izmišljene stranke, naprave brez blagovnih znamk, vrednosti so ponazoritev.
# Struktura sledi lekciji 19.1 »Servisni obisk od klica do poročila«: pred obiskom → na terenu → po obisku.
# Posegi v krog hladiva so vedno zapisani kot delo serviserja s spričevalom, količine hladiva po teži.
# Električnih popravil primer ne opisuje.
#
# koda: naključna koda naprave na nalepki (QR vodi na prijavo napake s to kodo) – brez osebnih podatkov.
# naslednji_servis / opomnik_poslan: za opomnike stranki pred rednim servisom.
# status: planiran | caka (opravljeno, čaka kontrola) | zakljucen

stranke:
  - id: s01
    ime: Kovač
    kraj: Domžale
    koda: K7F3Q
    naslednji_servis: "2027-01-20"
    naprava: { tip: "Zrak-voda, monoblok", moc: 8, hladivo: R32, gwp: 675, polnitev: 1.65, leto: 2021, oddajniki: "Talno ogrevanje" }
    nalogi:
      - id: DN-2026-031
        datum: 2026-01-20
        vrsta: Okvara
        status: zakljucen
        klic:
          simptom: Hiša se greje počasneje, naprava je dvakrat javila napako pretoka.
          od_kdaj: Približno dva tedna, slabše od velikega mraza.
          stranka_ze: Ponovni zagon naprave – napaka se vrne čez nekaj ur.
          pripravim: Zapisnik zadnjega servisa (2025), termometra za cevi, manometre, detektor puščanja.
        obhod:
          - Tlak vode 1,4 bar (hladen sistem), v območju iz navodil.
          - Zunanja enota prosta, lamele čiste, brez ledu.
          - Filter vodnega kroga poln rjavega mulja.
          - Na spoju pod zunanjo enoto sled olja.
        pogoji: "Zunaj 1 °C, ogrevanje, ustaljeno delovanje 25 min"
        meritve:
          - { velicina: "Dvižni vod", pred: "38 °C", po: "35 °C" }
          - { velicina: "Povratni vod", pred: "29 °C", po: "30 °C" }
          - { velicina: "ΔT vode", pred: "9 K", po: "5 K" }
          - { velicina: "Pregrevanje SH (po čiščenju filtra)", pred: "14 K", po: "6 K" }
          - { velicina: "Podhlajevanje SC (po čiščenju filtra)", pred: "1 K", po: "5 K" }
        vzrok: "Dve napaki: zamašen filter vode (premajhen pretok) in puščanje hladiva na spoju."
        dokaz: "Po čiščenju filtra se ΔT vrne na 5 K, a SH ostane visoko in SC nizko – premalo hladiva. Elektronski detektor potrdi puščanje na spoju z oljno sledjo."
        popravilo:
          - Očiščen filter vodnega kroga.
          - "Serviser s spričevalom: zajem hladiva, popravilo spoja, tlačni preizkus z dušikom, vakuumiranje, polnjenje po teži."
        hladivo: { zajeto: 1.21, napolnjeno: 1.65 }
        priporocila:
          - Filter vodnega kroga pregledati vsako leto pred kurilno sezono.
          - Tlak vode odčitati enkrat na mesec in zapisati.
          - Kontrola tesnosti spoja v enem mesecu (nalog DN-2026-038).
        klic_po: "Čez 4 dni: hiša se greje normalno, napake ni bilo več."

      - id: DN-2026-038
        datum: 2026-02-18
        vrsta: Kontrola tesnosti
        status: zakljucen
        klic:
          simptom: Dogovorjena kontrola po popravilu puščanja.
          od_kdaj: –
          stranka_ze: –
          pripravim: Detektor puščanja, poročilo DN-2026-031.
        obhod:
          - Brez oljnih sledi na popravljenem spoju.
          - Tlak vode 1,4 bar.
        pogoji: "Zunaj 6 °C, ogrevanje, ustaljeno delovanje 20 min"
        meritve:
          - { velicina: "Pregrevanje SH", pred: "6 K", po: "6 K" }
          - { velicina: "Podhlajevanje SC", pred: "5 K", po: "5 K" }
        vzrok: Kontrola – brez napake.
        dokaz: Detektor na spoju in servisnih priključkih ne zazna puščanja. SH in SC enaka kot ob zaključku popravila.
        popravilo:
          - Brez posega.
        priporocila:
          - Naslednji pregled ob rednem letnem servisu.
        klic_po: "–"

